[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-intelligence-agent"
version = "0.1.0"
description = "CAPABL Track 6 - Recruitment Intelligence Agent: Agentic HR screener, deterministic matcher, and interview scheduler"
authors = [{ name = "CAPABL Track 6 Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.14,<0.3.0",
    "langchain-core>=0.2.35,<0.3.0",
    "langchain-community>=0.2.12,<0.3.0",
    "langchain-ollama>=0.1.1,<0.2.0",
    "langchain-groq>=0.1.9,<0.3.0",
    "pypdf>=4.3.1",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.5.5",
    "langchain-chroma>=0.1.2",
    "sentence-transformers>=3.0.1",
    "langchain-huggingface>=0.0.3",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.37.1",
    "mcp>=1.24.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "flake8>=7.1.1",
    "mypy>=1.11.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
