apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recruitment-agent-ingress
  namespace: recruitment-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "recruitment-agent-service"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - recruitment.capabl.local
      secretName: recruitment-agent-tls
  rules:
    - host: recruitment.capabl.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recruitment-agent-service
                port:
                  number: 80
